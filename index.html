  :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120f0d;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e8e0ce}body{display:grid;place-items:center}canvas{display:block;border:1px solid #5e4a36;border-radius:8px;box-shadow:0 24px 80px #000b,0 0 0 1px #d19a5144;background:#171411;image-rendering:auto}

<body><canvas id="game" width="960" height="640"></canvas>
<script>
"use strict";
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d");
const TILE=40,COLS=19,ROWS=16,FIELD_W=COLS*TILE,FIELD_H=ROWS*TILE,HUD_W=200,W=FIELD_W+HUD_W,H=FIELD_H;
const UP=0,RIGHT=1,DOWN=2,LEFT=3,DIRS=[[0,-1],[1,0],[0,1],[-1,0]],ANGLES=[0,Math.PI/2,Math.PI,-Math.PI/2];
const EMPTY=0,BRICK=1,STEEL=2,WATER=3,TREE=4,ROAD=5,BASE=6,CRATE=7,TAU=Math.PI*2;
const PLAYER_SPAWN={col:9,row:13};
const missions=[
 {title:"检查站突破",subtitle:"BREAK THE CHECKPOINT",objective:"摧毁所有敌方装甲，突破峡谷检查站",kind:"clear",waves:3},
 {title:"补给线护航",subtitle:"HOLD THE CONVOY ROUTE",objective:"护送补给车穿过山谷公路",kind:"escort",waves:4},
 {title:"前沿基地",subtitle:"DEFEND THE OUTPOST",objective:"守住前沿基地 90 秒",kind:"defend",waves:4},
 {title:"炮兵阵地",subtitle:"SILENCE THE BATTERY",objective:"摧毁 3 个敌方炮兵阵地",kind:"destroy",waves:4},
 {title:"夕阳山谷",subtitle:"SUNSET VALLEY",objective:"击败敌方指挥坦克",kind:"boss",waves:5}
];
const enemyTypes={scout:{name:"侦察车",color:"#b6c1b3",hp:1,speed:178,score:130},assault:{name:"突击坦克",color:"#799276",hp:2,speed:128,score:220},heavy:{name:"重装坦克",color:"#8f7865",hp:4,speed:82,score:420},artillery:{name:"火炮车",color:"#b18a61",hp:2,speed:74,score:500},commander:{name:"指挥坦克",color:"#d28a55",hp:4,speed:100,score:760},boss:{name:"峡谷指挥官",color:"#d95c47",hp:28,speed:68,score:5000}};
const maps=[
 ["...................","..#....r....#......","..#..###....#..%...",".....#......#......",".####....~~....####","...................","..%..##....##..%...",".....#..==..#......","..##......==....##.","...................","....@..####..@.....","...###......###....","......#....#.......","......#....#.......",".......#BB#........","..................."],
 ["...................","..%....#....%......",".###...#....###....",".....###..###......","........==.........","..####........####.","..#..............#.","..#..====..====..#.","..#..............#.","..####........####.","....#....@....#....","....#..####..#.....","......#....#.......","......#....#.......",".......#BB#........","..................."],
 ["...................","...@..##....##..@..","...#..............#","...#..####..####..#","...................","..~~~~........~~~~.","..~~~~....##..~~~~.","...................",".##..##......##..##","...................","....@......@.......",".....####..####....","......#....#.......","......#....#.......",".......#BB#........","..................."]
];
const keys={};let grid=[],baseCells=[];
let state="start",level=0,score=0,hiScore=0,lives=3,tactical=0,missionProgress=0,missionTimer=0,stateTimer=0;
let player,enemies=[],bullets=[],particles=[],powerups=[],targets=[],convoy,weatherTime=0,shake=0,notice="",noticeTimer=0;
let upgrades={armor:0,firepower:0,mobility:0,ammo:0,recon:0,drone:0};
let save={chapter:0,hiscore:0,settings:{shake:true}};
try{save=Object.assign(save,JSON.parse(localStorage.getItem("tankbattle_v2")||"{}"));hiScore=save.hiscore||0;}catch(e){}
const audio=(()=>{let ac=null,muted=false;function go(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac&&ac.state==="suspended")ac.resume();return ac}function tone(f,d,t="triangle",v=.05,to){if(muted)return;const a=go();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}return{toggle(){muted=!muted;return muted},shoot(){tone(240,.08,"square",.035,80)},hit(){tone(180,.06,"sawtooth",.04)},boom(){tone(100,.25,"sawtooth",.08,35)},level(){tone(380,.18,"triangle",.06,760)},upgrade(){tone(520,.12,"triangle",.06,1040)},get muted(){return muted}}})();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(a,b){return a+Math.random()*(b-a)}function ri(a,b){return Math.floor(rand(a,b+1))}function over(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function rect(t){return{x:t.x,y:t.y,w:t.size||32,h:t.size||32}}function shade(c,f){const n=parseInt(c.slice(1),16),r=clamp((n>>16&255)*f,0,255),g=clamp((n>>8&255)*f,0,255),b=clamp((n&255)*f,0,255);return`rgb(${r|0},${g|0},${b|0})`}function saveGame(){save.chapter=Math.max(save.chapter,level);save.hiscore=Math.max(save.hiscore,score);try{localStorage.setItem("tankbattle_v2",JSON.stringify(save))}catch(e){}}
function cell(ch){return ch==="#"?{type:BRICK,hp:2}:ch==="@"?{type:STEEL,hp:1}:ch==="~"?{type:WATER,hp:1}:ch==="%"?{type:TREE,hp:1}:ch==="="?{type:ROAD,hp:1}:ch==="B"?{type:BASE,hp:1}:ch==="r"?{type:CRATE,hp:1}:{type:EMPTY,hp:0}}
function buildMap(){const src=maps[level%maps.length];grid=[];baseCells=[];targets=[];for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){grid[r][c]=cell(src[r][c]);if(grid[r][c].type===BASE)baseCells.push({r,c});if(src[r][c]==="r")targets.push({x:c*TILE+8,y:r*TILE+8,w:24,h:24,alive:true})}}}
function range(r){return{c0:clamp(Math.floor(r.x/TILE),0,COLS-1),c1:clamp(Math.floor((r.x+r.w-1)/TILE),0,COLS-1),r0:clamp(Math.floor(r.y/TILE),0,ROWS-1),r1:clamp(Math.floor((r.y+r.h-1)/TILE),0,ROWS-1)}}function solidTank(t){return[t===BRICK,t===STEEL,t===WATER,t===BASE].some(Boolean)}function solidBullet(t){return[t===BRICK,t===STEEL,t===BASE].some(Boolean)}function blocked(r,self){if(r.x<0||r.y<0||r.x+r.w>FIELD_W||r.y+r.h>FIELD_H)return true;const q=range(r);for(let y=q.r0;y<=q.r1;y++)for(let x=q.c0;x<=q.c1;x++)if(solidTank(grid[y][x].type))return true;for(const t of [player,...enemies])if(t&&t!==self&&!t.dead&&!t.spawn&&over(r,rect(t)))return true;return false}
function makeTank(x,y,dir,o={}){return Object.assign({x,y,dir,size:32,speed:120,hp:1,maxHp:1,color:"#849178",isPlayer:false,dead:false,spawn:true,spawnTime:1,shoot:1,ai:1,flash:0,type:"assault"},o)}
function spawnCellIsClear(col,row){if(col<0||col>=COLS||row<0||row>=ROWS)return false;if(solidTank(grid[row][col].type))return false;const candidate={x:col*TILE+4,y:row*TILE+4,w:32,h:32};return ![player,...enemies].some(t=>t&&!t.dead&&over(candidate,rect(t)))}
function findPlayerSpawn(){const offsets=[[0,0],[0,-1],[-1,0],[1,0],[0,1],[0,-2],[-2,0],[2,0],[0,2]];for(const [dc,dr] of offsets){const col=PLAYER_SPAWN.col+dc,row=PLAYER_SPAWN.row+dr;if(spawnCellIsClear(col,row))return{x:col*TILE+4,y:row*TILE+4}}return{x:PLAYER_SPAWN.col*TILE+4,y:PLAYER_SPAWN.row*TILE+4}}
function makePlayer(){const armor=upgrades.armor,pos=findPlayerSpawn();player=makeTank(pos.x,pos.y,UP,{isPlayer:true,color:"#c69b55",speed:130+upgrades.mobility*17,hp:100+armor*25,maxHp:100+armor*25,spawnTime:1.4})}
function startGame(){score=0;lives=3;level=0;tactical=0;missionProgress=0;upgrades={armor:0,firepower:0,mobility:0,ammo:0,recon:0,drone:0};startMission(0)}
function startMission(n){level=n;buildMap();enemies=[];bullets=[];particles=[];powerups=[];convoy={x:90,y:470,hp:100,progress:0,alive:true};missionTimer=missions[level].kind==="defend"?90:0;missionProgress=0;makePlayer();spawnWave();state="intro";stateTimer=2.4;notice=missions[level].objective;noticeTimer=4;audio.level()}
function spawnWave(){const m=missions[level],count=3+Math.min(4,m.waves)+level;for(let i=0;i<count;i++){const kinds=level>2?["scout","assault","heavy","artillery","commander"]:level>0?["scout","assault","heavy","artillery"]:["scout","assault","heavy"];let type=kinds[(i+level)%kinds.length];if(m.kind==="boss"&&i===count-1)type="boss";const inf=enemyTypes[type],col=[1,9,17][i%3];enemies.push(makeTank(col*TILE+4,4+ri(0,2)*TILE,DOWN,{type,color:inf.color,hp:inf.hp,maxHp:inf.hp,speed:inf.speed,shoot:rand(.6,2),ai:rand(.5,1.8),spawnTime:1.1}))}if(m.kind==="destroy")targets=[{x:3*TILE+8,y:2*TILE+8,w:24,h:24,alive:true},{x:15*TILE+8,y:3*TILE+8,w:24,h:24,alive:true},{x:9*TILE+8,y:10*TILE+8,w:24,h:24,alive:true}]}
function newBullet(t,dir,owner,damage=1,speed=360){const v=DIRS[dir];return{x:t.x+16+v[0]*19-3,y:t.y+16+v[1]*19-3,w:6,h:6,dir,owner,damage,speed,dead:false}}
function fire(t){const cap=1+upgrades.ammo+(t.isPlayer?upgrades.firepower:0);if(bullets.filter(b=>b.owner===t&&!b.dead).length>=cap)return;bullets.push(newBullet(t,t.dir,t,t.isPlayer?1+upgrades.firepower:1,t.isPlayer?390:260));audio.shoot();t.shoot=t.isPlayer?.28:rand(1.2,2.5)}
function spawnFX(x,y,color,n=10,s=100){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rand(20,s);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.25,.8),max:.8,color,size:rand(2,6)})}}
function notify(s){notice=s;noticeTimer=3}
function update(dt){weatherTime+=dt;if(noticeTimer>0)noticeTimer-=dt;if(shake>0)shake-=dt;if(state==="intro"){stateTimer-=dt;if(stateTimer<=0)state="playing";return}if(state!=="playing")return;missionTimer-=missions[level].kind==="defend"?dt:0;if(missionTimer<=0&&missions[level].kind==="defend"){missionProgress=1;winMission()}updatePlayer(dt);updateEnemies(dt);updateBullets(dt);updateParticles(dt);updateConvoy(dt);if(upgrades.drone&&Math.random()<dt*.2){const e=enemies.find(x=>!x.dead);if(e){e.hp-=1;spawnFX(e.x+16,e.y+16,"#f2c26b",4,60)}}if(enemies.every(e=>e.dead)&&missionProgress<1){if(missions[level].kind==="clear"||missions[level].kind==="boss")winMission();else if(missions[level].kind==="destroy"&&targets.every(t=>!t.alive))winMission();else if(missions[level].kind==="escort"&&convoy.progress>=1)winMission()}if(player&&player.hp<=0)loseLife()}
function updatePlayer(dt){if(!player||player.dead)return;if(player.spawn){player.spawnTime-=dt;if(player.spawnTime<=0)player.spawn=false}const d=dir();if(d>=0){if(d!==player.dir&&d%2!==player.dir%2){if(d===UP||d===DOWN)player.x=snap(player.x);else player.y=snap(player.y)}player.dir=d;const v=DIRS[d],n={x:player.x+v[0]*player.speed*dt,y:player.y+v[1]*player.speed*dt,w:32,h:32};if(!blocked(n,player)){player.x=n.x;player.y=n.y}}if(keys.Space&&!player.spawn){player.shoot-=dt;if(player.shoot<=0)fire(player)}else player.shoot=0}
function updateEnemies(dt){for(const e of enemies){if(e.dead)continue;if(e.spawn){e.spawnTime-=dt;if(e.spawnTime<=0)e.spawn=false;continue}e.flash=Math.max(0,e.flash-dt);e.ai-=dt;if(e.ai<=0){e.ai=rand(.5,2);const choices=[UP,RIGHT,DOWN,LEFT].filter(d=>{const v=DIRS[d];return!blocked({x:e.x+v[0]*4,y:e.y+v[1]*4,w:32,h:32},e)});if(choices.length)e.dir=choices[ri(0,choices.length-1)]}const v=DIRS[e.dir],n={x:e.x+v[0]*e.speed*dt,y:e.y+v[1]*e.speed*dt,w:32,h:32};if(!blocked(n,e)){e.x=n.x;e.y=n.y}else e.ai=0;if(player&&!player.spawn&&Math.random()<dt*.06){const dx=player.x-e.x,dy=player.y-e.y;e.dir=Math.abs(dx)>Math.abs(dy)?dx>0?RIGHT:LEFT:dy>0?DOWN:UP}e.shoot-=dt;if(e.shoot<=0){fire(e);e.shoot=rand(1.2,3)}if(missions[level].kind==="destroy")for(const t of targets)if(t.alive&&over(rect(e),t))t.alive=false}}
function updateBullets(dt){for(const b of bullets){if(b.dead)continue;const v=DIRS[b.dir];b.x+=v[0]*b.speed*dt;b.y+=v[1]*b.speed*dt;if(b.x<0||b.y<0||b.x>FIELD_W||b.y>FIELD_H){b.dead=true;continue}const q=range(b);let hit=false;for(let y=q.r0;y<=q.r1&&!hit;y++)for(let x=q.c0;x<=q.c1&&!hit;x++){const c=grid[y][x];if(solidBullet(c.type)){if(c.type===BRICK){c.hp-=b.damage;if(c.hp<=0)c.type=EMPTY;spawnFX(x*TILE+20,y*TILE+20,"#c88750",6,80)}else if(c.type===STEEL&&b.damage>=3)c.type=EMPTY;else if(c.type===BASE)destroyBase();b.dead=true;hit=true}}if(hit)continue;for(const t of b.owner===player?enemies:[player])if(t&&!t.dead&&!t.spawn&&over(b,rect(t))){if(t===player){t.hp-=Math.max(10,18-upgrades.armor*2);t.flash=.18;spawnFX(t.x+16,t.y+16,"#d66e45",8,110);if(t.hp<=0)loseLife()}else hitEnemy(t,b);b.dead=true;break}for(const t of targets)if(t.alive&&over(b,t)){t.alive=false;b.dead=true;score+=500;spawnFX(t.x+12,t.y+12,"#e39d55",18,150);break}}bullets=bullets.filter(b=>!b.dead)}
function hitEnemy(e,b){e.hp-=b.damage;e.flash=.15;if(e.hp<=0){e.dead=true;score+=enemyTypes[e.type].score;spawnFX(e.x+16,e.y+16,e.color,24,180);audio.boom();if(Math.random()<.14)powerups.push({x:e.x,y:e.y,type:["armor","fire","repair","bomb"][ri(0,3)],life:12})}else audio.hit()}
function loseLife(){if(!player||player.dead)return;player.dead=true;lives--;spawnFX(player.x+16,player.y+16,"#e1a159",28,190);audio.boom();if(lives<=0){state="gameover";saveGame()}else{makePlayer();notify("坦克受损，重新部署")}}
function destroyBase(){if(!baseCells.length)return;for(const b of baseCells)grid[b.r][b.c].type=EMPTY;baseCells=[];state="gameover";notify("前沿基地失守");saveGame();audio.boom()}
function updateConvoy(dt){if(missions[level].kind!=="escort"||!convoy.alive)return;convoy.progress=clamp(convoy.progress+dt*.018,0,1);convoy.x=90+convoy.progress*(FIELD_W-190);if(Math.random()<dt*.04)convoy.hp-=2;if(convoy.hp<=0){convoy.alive=false;state="gameover";notify("补给车队被摧毁");saveGame()}if(convoy.progress>=1)winMission()}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.91;p.vy*=.91;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const p of powerups)p.life-=dt;powerups=powerups.filter(p=>p.life>0&&!(player&&over(rect(player),{x:p.x,y:p.y,w:28,h:28})&&(collect(p),true)))}
function collect(p){if(p.type==="armor")player.hp=clamp(player.hp+35,0,player.maxHp);if(p.type==="fire")upgrades.firepower=clamp(upgrades.firepower+1,0,3);if(p.type==="repair")player.hp=player.maxHp;if(p.type==="bomb")enemies.forEach(e=>{if(!e.dead){e.hp=0;e.dead=true;score+=enemyTypes[e.type].score}});spawnFX(p.x+14,p.y+14,"#e6bd64",12,100);audio.upgrade()}
function winMission(){if(missionProgress)return;missionProgress=1;tactical+=2+level;score+=1000+level*500;saveGame();if(level>=missions.length-1){state="victory";audio.level()}else{state="upgrade";audio.level()}}
function buy(k,cost){if(tactical<cost)return;upgrades[k]++;tactical-=cost;if(k==="armor"&&player){player.maxHp+=25;player.hp+=25}if(k==="mobility"&&player)player.speed+=17;audio.upgrade();notify("升级完成："+({armor:"装甲强化",firepower:"穿甲火力",mobility:"机动强化",ammo:"弹药扩容",recon:"侦察网络",drone:"无人机支援"}[k]||k))}
function nextMission(){if(level<missions.length-1)startMission(level+1)}
function dir(){return keys.ArrowUp||keys.KeyW?UP:keys.ArrowRight||keys.KeyD?RIGHT:keys.ArrowDown||keys.KeyS?DOWN:keys.ArrowLeft||keys.KeyA?LEFT:-1}function snap(v){return Math.round((v-4)/TILE)*TILE+4}
function draw(){ctx.save();if(save.settings.shake&&shake>0)ctx.translate(rand(-shake*8,shake*8),rand(-shake*8,shake*8));drawWorld();drawEntities();drawFX();drawHUD();ctx.restore();drawOverlay()}
function drawWorld(){const g=ctx.createLinearGradient(0,0,0,FIELD_H);g.addColorStop(0,"#d0774f");g.addColorStop(.28,"#8d5947");g.addColorStop(1,"#342d28");ctx.fillStyle=g;ctx.fillRect(0,0,FIELD_W,FIELD_H);ctx.fillStyle="rgba(248,184,90,.18)";ctx.beginPath();ctx.arc(110,70,70,0,TAU);ctx.fill();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=c*TILE,y=r*TILE,cell=grid[r][c];if(cell.type===ROAD){ctx.fillStyle="#79604b";ctx.fillRect(x,y,TILE,TILE)}else if(cell.type===WATER){ctx.fillStyle="#425d62";ctx.fillRect(x,y,TILE,TILE);ctx.strokeStyle="#789394";ctx.beginPath();ctx.moveTo(x+5,y+14);ctx.lineTo(x+34,y+14);ctx.stroke()}else if(cell.type===BRICK)drawBrick(x,y,cell.hp);else if(cell.type===STEEL)drawSteel(x,y);else if(cell.type===TREE)drawScrub(x,y);else if(cell.type===BASE)drawBase(x,y);else if(cell.type===CRATE)drawCrate(x,y)}for(let i=0;i<18;i++){const x=(i*97+weatherTime*18)%FIELD_W,y=80+(i*61)%450;ctx.fillStyle="rgba(226,164,105,.04)";ctx.fillRect(x,y,80,2)}if(convoy&&missions[level].kind==="escort")drawConvoy();for(const t of targets)if(t.alive)drawTarget(t)}
function drawBrick(x,y,hp){ctx.fillStyle="#87543b";ctx.fillRect(x,y,40,40);ctx.strokeStyle="#4e3429";ctx.strokeRect(x+.5,y+.5,39,39);ctx.strokeStyle="#b27650";for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(x,y+10*j+7);ctx.lineTo(x+40,y+10*j+7);ctx.stroke()}if(hp<2){ctx.strokeStyle="#d19a63";ctx.beginPath();ctx.moveTo(x+7,y+3);ctx.lineTo(x+26,y+23);ctx.moveTo(x+31,y+13);ctx.lineTo(x+13,y+39);ctx.stroke()}}
function drawSteel(x,y){ctx.fillStyle="#5c635c";ctx.fillRect(x,y,40,40);ctx.fillStyle="#7a8174";ctx.fillRect(x+4,y+4,32,32);ctx.strokeStyle="#a5a98c";ctx.strokeRect(x+7,y+7,26,26)}function drawScrub(x,y){ctx.fillStyle="#3e5537";ctx.beginPath();ctx.arc(x+20,y+24,17,0,TAU);ctx.fill();ctx.fillStyle="#71804d";ctx.beginPath();ctx.arc(x+14,y+16,10,0,TAU);ctx.fill()}function drawCrate(x,y){ctx.fillStyle="#98714a";ctx.fillRect(x+4,y+5,32,30);ctx.strokeStyle="#d0a36b";ctx.strokeRect(x+5,y+6,30,28);ctx.beginPath();ctx.moveTo(x+7,y+8);ctx.lineTo(x+33,y+32);ctx.moveTo(x+33,y+8);ctx.lineTo(x+7,y+32);ctx.stroke()}function drawBase(x,y){ctx.fillStyle="#2c2a25";ctx.fillRect(x,y,40,40);ctx.fillStyle="#d8b75e";ctx.fillRect(x+19,y+7,2,28);ctx.fillStyle="#c95543";ctx.beginPath();ctx.moveTo(x+21,y+9);ctx.lineTo(x+34,y+14);ctx.lineTo(x+21,y+19);ctx.fill()}
function drawTarget(t){ctx.fillStyle="#d55b42";ctx.fillRect(t.x,t.y,t.w,t.h);ctx.strokeStyle="#ffd09a";ctx.strokeRect(t.x-4,t.y-4,t.w+8,t.h+8)}function drawConvoy(){const x=convoy.x,y=convoy.y;ctx.fillStyle="#b47a4d";ctx.fillRect(x,y,48,25);ctx.fillStyle="#39483d";ctx.fillRect(x+8,y-8,30,30);ctx.fillStyle="#1c211c";ctx.beginPath();ctx.arc(x+9,y+28,6,0,TAU);ctx.arc(x+40,y+28,6,0,TAU);ctx.fill();ctx.fillStyle="#e6bd65";ctx.fillRect(x,y-16,48,3)}
function drawEntities(){for(const b of bullets){ctx.fillStyle=b.owner===player?"#ffe2a3":"#ef8460";ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle="#fff1c9";ctx.fillRect(b.x+1,b.y+1,2,2)}for(const p of powerups){ctx.fillStyle="#2b211b";ctx.fillRect(p.x,p.y,28,28);ctx.strokeStyle="#e2b15d";ctx.strokeRect(p.x+1,p.y+1,26,26);ctx.fillStyle="#f2c26b";ctx.font="bold 15px monospace";ctx.textAlign="center";ctx.fillText(p.type==="bomb"?"B":p.type==="fire"?"F":p.type==="repair"?"+":"A",p.x+14,p.y+19)}if(player&&!player.dead)drawTank(player);for(const e of enemies)if(!e.dead)drawTank(e)}
function drawTank(t){const blink=t.spawn||t.flash>0&&Math.floor(performance.now()/70)%2===0;ctx.save();ctx.globalAlpha=blink?.35:1;ctx.translate(t.x+16,t.y+16);ctx.rotate(ANGLES[t.dir]);ctx.fillStyle="#171b17";ctx.fillRect(-16,-14,6,28);ctx.fillRect(10,-14,6,28);ctx.fillStyle=shade(t.color,.65);ctx.fillRect(-10,-13,20,26);ctx.fillStyle=t.color;ctx.fillRect(-8,-12,16,24);ctx.fillStyle=shade(t.color,1.2);ctx.beginPath();ctx.arc(0,0,8,0,TAU);ctx.fill();ctx.fillStyle="#26251e";ctx.fillRect(-2,-22,4,17);ctx.fillStyle=t.isPlayer?"#e2b85f":t.type==="boss"?"#e15543":"#d7cc9c";ctx.fillRect(-3,-3,6,6);if(t.type==="boss"){ctx.strokeStyle="#f1a45c";ctx.lineWidth=2;ctx.strokeRect(-19,-19,38,38)}ctx.restore();if(!t.isPlayer&&t.maxHp>1){ctx.fillStyle="#171512aa";ctx.fillRect(t.x,t.y-7,32,4);ctx.fillStyle="#d36a4e";ctx.fillRect(t.x,t.y-7,32*t.hp/t.maxHp,4)}}
function drawFX(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}ctx.globalAlpha=1}
function panel(x,y,w,h){ctx.fillStyle="rgba(22,20,17,.76)";ctx.fillRect(x,y,w,h);ctx.strokeStyle="rgba(231,190,115,.35)";ctx.strokeRect(x+.5,y+.5,w-1,h-1)}function text(s,x,y,size,color="#eee4cf",weight="400"){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Segoe UI","Microsoft YaHei",sans-serif`;ctx.textAlign="left";ctx.textBaseline="top";ctx.fillText(s,x,y)}
function drawHUD(){const m=missions[level]||missions[0],x=FIELD_W;ctx.fillStyle="#211a16";ctx.fillRect(x,0,HUD_W,H);ctx.strokeStyle="#a9784a";ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke();text("SUNSET FRONT",x+18,18,12,"#e2b15d","700");text(`CHAPTER ${level+1} / ${missions.length}`,x+18,38,11,"#988e7c");text(m.title,x+18,72,19,"#f0e4c9","700");text(m.subtitle,x+18,98,10,"#d46e4d","700");text(m.objective,x+18,123,11,"#c5b8a2");if(m.kind==="defend")text(`剩余 ${Math.ceil(Math.max(0,missionTimer))} 秒`,x+18,154,14,"#e5bb67","700");if(m.kind==="escort")text(`车队 ${Math.ceil(convoy?.hp||0)}%`,x+18,154,14,"#77b57d","700");if(m.kind==="destroy")text(`阵地 ${targets.filter(t=>!t.alive).length} / ${targets.length}`,x+18,154,14,"#e5bb67","700");panel(x+14,190,172,112);text("TANK STATUS",x+25,202,10,"#9c927f","700");text(`装甲  ${Math.max(0,Math.ceil((player?.hp||0)))} / ${player?.maxHp||0}`,x+25,224,12,"#d7c8aa");bar(x+25,244,140,8,(player?.hp||0)/(player?.maxHp||1),"#c48655");text(`火力 ${upgrades.firepower}   弹药 ${1+upgrades.ammo}`,x+25,264,11,"#d7c8aa");text(`战术点  ${tactical}`,x+18,330,14,"#e2b15d","700");text(`分数  ${String(score).padStart(6,"0")}`,x+18,356,14,"#ded5c0","700");text(`最高分  ${Math.max(hiScore,score)}`,x+18,380,11,"#938b7c");drawMiniMap(x+15,420);text("WASD / 方向键 移动",x+18,590,10,"#887e70");text("空格射击 · P暂停 · M静音",x+18,607,10,"#887e70")}
function bar(x,y,w,h,v,c){ctx.fillStyle="#403a31";ctx.fillRect(x,y,w,h);ctx.fillStyle=c;ctx.fillRect(x,y,w*clamp(v,0,1),h)}function drawMiniMap(x,y){const w=170,h=145;panel(x,y,w,h);const sx=w/FIELD_W,sy=h/FIELD_H;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r][c].type;ctx.fillStyle=t===BRICK?"#8c5a40":t===STEEL?"#8d8c76":t===WATER?"#426469":t===TREE?"#455a38":"#4d4034";ctx.fillRect(x+c*TILE*sx,y+r*TILE*sy,TILE*sx+1,TILE*sy+1)}if(player){ctx.fillStyle="#dcbf6b";ctx.fillRect(x+player.x*sx-2,y+player.y*sy-2,5,5)}for(const e of enemies)if(!e.dead&&(upgrades.recon||Math.random()<.35)){ctx.fillStyle="#d6634d";ctx.fillRect(x+e.x*sx-2,y+e.y*sy-2,5,5)}ctx.fillStyle="#f2c26b";ctx.font="10px monospace";ctx.fillText("N",x+w-12,y+11)}
function drawOverlay(){if(state==="start"){shadeOverlay();text("TANK BATTLE",FIELD_W/2-150,185,54,"#e9bd6a","700");text("SUNSET FRONT",FIELD_W/2-95,250,18,"#c96f4e","700");text("战役 · 沙漠前线",FIELD_W/2-75,285,16,"#e1d3b7");text("ENTER 开始战役",FIELD_W/2-90,350,21,"#fff0cd","700");text("R 重置存档 · M 静音",FIELD_W/2-88,390,12,"#b3a893")}else if(state==="intro"){shadeOverlay(.48);text(`MISSION ${level+1}`,FIELD_W/2-115,205,16,"#d46e4d","700");text(missions[level].title,FIELD_W/2-150,240,42,"#f3d79c","700");text(missions[level].objective,FIELD_W/2-180,305,15,"#e7dbc2");text("部署中…",FIELD_W/2-42,350,13,"#dba65c")}else if(state==="paused"){shadeOverlay();text("暂停",FIELD_W/2-60,245,42,"#f0d39a","700");text("按 P 继续",FIELD_W/2-55,315,16,"#ddd0b5")}else if(state==="upgrade")drawUpgrade();else if(state==="gameover"||state==="victory"){shadeOverlay();text(state==="victory"?"战役胜利":"任务失败",FIELD_W/2-130,190,46,state==="victory"?"#e9c477":"#d96b53","700");text(state==="victory"?"夕阳下的前线暂时安静了":"装甲部队需要重新集结",FIELD_W/2-150,260,16,"#e5d9c2");text(`得分 ${score}   最高分 ${Math.max(hiScore,score)}`,FIELD_W/2-120,300,16,"#d0bea0");text("ENTER 返回标题 · R 重新开始",FIELD_W/2-135,370,15,"#fff0cd")}if(noticeTimer>0&&state==="playing"){panel(24,FIELD_H-72,430,40);text(notice,38,FIELD_H-61,13,"#f0d39a")}}
function shadeOverlay(a=.76){ctx.fillStyle=`rgba(17,12,10,${a})`;ctx.fillRect(0,0,FIELD_W,FIELD_H)}function drawUpgrade(){shadeOverlay(.9);text("战术整备",FIELD_W/2-85,62,32,"#f0d39a","700");text(`任务完成 · 获得战术点 ${tactical}`,FIELD_W/2-150,108,14,"#d46e4d");const list=["armor","firepower","mobility","ammo","recon","drone"],names={armor:"装甲强化",firepower:"穿甲火力",mobility:"机动强化",ammo:"弹药扩容",recon:"侦察网络",drone:"无人机支援"};list.forEach((k,i)=>{const x=FIELD_W/2-215+(i%3)*150,y=175+Math.floor(i/3)*105;panel(x,y,130,78);text(`${i+1}  ${names[k]}`,x+12,y+12,13,"#e6d7b7","700");text(`等级 ${upgrades[k]}`,x+12,y+36,11,"#a99a82");text("2 点升级",x+12,y+54,10,"#d89a5b")});text("按 1-6 选择升级 · ENTER 继续下一关",FIELD_W/2-150,420,14,"#fff0cd")}
function resetToTitle(){state="start";level=0;score=0;tactical=0;upgrades={armor:0,firepower:0,mobility:0,ammo:0,recon:0,drone:0};buildMap()}
window.addEventListener("keydown",e=>{if(e.code==="KeyV"){save.settings.shake=!save.settings.shake;saveGame();notify(save.settings.shake?"屏幕震动开启":"屏幕震动关闭")}});
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==="KeyP"&&(state==="playing"||state==="paused"))state=state==="paused"?"playing":"paused";if(e.code==="KeyM")audio.toggle();if(e.code==="KeyR"){if(state==="start")try{localStorage.removeItem("tankbattle_v2")}catch(x){}startGame()}if(e.code==="Enter"){if(state==="start")startGame();else if(state==="upgrade")nextMission();else if(state==="gameover"||state==="victory")resetToTitle()}if(state==="upgrade"&&/^Digit[1-6]$/.test(e.code))buy(["armor","firepower","mobility","ammo","recon","drone"][+e.code.slice(-1)-1],2)});window.addEventListener("keyup",e=>keys[e.code]=false);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H)*.96;canvas.style.width=W*s+"px";canvas.style.height=H*s+"px"}window.addEventListener("resize",resize);buildMap();resize();let last=0;function loop(t){const dt=Math.min((t-last)/1000,.05)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
