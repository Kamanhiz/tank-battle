<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Tank Battle</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #1a1f2b 0%, #0b0e14 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 2px #2a3142;
    border-radius: 6px;
    background: #0d1117;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="840" height="640"></canvas>
</div>

<script>
"use strict";

/* ============================== 常量 ============================== */
const TILE        = 40;                 // 每个格子像素
const COLS        = 16;                 // 地图列数
const ROWS        = 16;                 // 地图行数
const FIELD_W     = COLS * TILE;        // 640
const FIELD_H     = ROWS * TILE;        // 640
const HUD_W       = 200;
const CANVAS_W    = FIELD_W + HUD_W;    // 840
const CANVAS_H    = FIELD_H;            // 640

const TANK_SIZE   = 32;                 // 坦克略小于格子，保证能通过通道
const TANK_MARGIN = (TILE - TANK_SIZE) / 2; // 4
const TANK_SPEED  = 130;                // px/s
const FAST_SPEED  = 200;                // 快速敌人
const BULLET_SIZE = 6;

// 方向
const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
const DIR_ANGLE = [0, Math.PI/2, Math.PI, -Math.PI/2];
const DIR_VEC   = [[0,-1],[1,0],[0,1],[-1,0]];

// 格子类型
const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;

// 火力等级对应的子弹速度
const BULLET_SPEEDS = [300, 430, 300, 430];

const ENEMIES_PER_LEVEL = 15;
const MAX_ENEMIES_ON_SCREEN = 4;
const MAX_LIVES = 5;

// 敌人类型
const ENEMY_TYPES = [
  { color: "#b9c4d4", hp: 1, speed: 130, score: 100, name: "普通" },   // 银色
  { color: "#5aa7ff", hp: 1, speed: 200, score: 200, name: "快速" },   // 蓝色
  { color: "#4fd07a", hp: 1, speed: 130, score: 300, name: "强力" },   // 绿色
  { color: "#ff7a5a", hp: 3, speed: 140, score: 400, name: "装甲" },   // 红色
];

/* ============================== 关卡地图 ============================== */
// . 空地  # 砖墙(2击)  @ 钢墙  ~ 水域  % 树林  B 基地
const LEVELS = [
  [
    "................",
    "................",
    ".#.#.#..#.#.#.#.",
    ".#.#.#..#.#.#.#.",
    ".#.#.#..#.#.#.#.",
    "................",
    "..##..####..##..",
    "................",
    "....@......@....",
    "..####....####..",
    "................",
    ".....#....#.....",
    ".....#.##.#.....",
    "......#..#......",
    "......#..#......",
    "......#BB#......",
  ],
  [
    "................",
    "....%%....%%....",
    ".#..##....##..#.",
    ".#.@@@@..@@@@.#.",
    ".#..##....##..#.",
    "................",
    "..####....####..",
    "..~~~~....~~~~..",
    "................",
    ".#..##....##..#.",
    ".#..##....##..#.",
    ".....#....#.....",
    ".....#.##.#.....",
    "......#..#......",
    "......#..#......",
    "......#BB#......",
  ],
  [
    "................",
    "................",
    ".@@...@@...@@...",
    ".#@#..#@#..#@#.",
    ".#..#..#..#..#.",
    "................",
    "..##..####..##..",
    "................",
    ".@#@........@#@.",
    "..##........##..",
    "................",
    ".....#....#.....",
    ".....#.##.#.....",
    "......#..#......",
    "......#..#......",
    "......#BB#......",
  ],
];

/* ============================== 音效 ============================== */
const AudioFX = (function () {
  let ctx = null, muted = false;
  function ensure() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; }
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted) return;
    const ac = ensure(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function noise(dur, vol) {
    if (muted) return;
    const ac = ensure(); if (!ac) return;
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    const s = ac.createBufferSource(); s.buffer = buf;
    const g = ac.createGain(); g.gain.value = vol || 0.2;
    s.connect(g); g.connect(ac.destination); s.start();
  }
  return {
    toggle() { muted = !muted; return muted; },
    get muted() { return muted; },
    shoot()   { tone(880, 0.08, "square", 0.05, 220); },
    hitWall() { tone(180, 0.05, "triangle", 0.06); },
    hitSteel(){ tone(660, 0.04, "square", 0.04); },
    explode() { noise(0.25, 0.22); tone(120, 0.25, "sawtooth", 0.08, 40); },
    powerup() { tone(520, 0.12, "triangle", 0.08, 1040); },
    life()    { tone(700, 0.1, "triangle", 0.08, 1400); },
    start()   { tone(440, 0.15, "triangle", 0.08, 880); },
    gameover(){ tone(400, 0.5, "sawtooth", 0.1, 60); },
  };
})();

/* ============================== 状态 ============================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let grid = [];          // grid[row][col] = {type, hp}
let baseCells = [];     // 基地格子 {row,col}
let playerSpawn = { col: 7, row: 14 };

let player = null;
let enemies = [];
let bullets = [];
let powerups = [];
let particles = [];

let score = 0, hiScore = 0, lives = 3, level = 0;
let firepower = 0;      // 0..3
let state = "start";    // start | intro | playing | gameover | victory | paused
let stateTimer = 0;
let shieldTimer = 0;    // 玩家护盾剩余
let freezeTimer = 0;    // 敌人冰冻剩余

let remainingSpawns = 0, spawnTimer = 0;
let totalSpawned = 0;
let baseAlive = true;

const keys = {};
try { hiScore = parseInt(localStorage.getItem("tankbattle_hiscore") || "0", 10) || 0; } catch (e) {}

/* ============================== 工具 ============================== */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r * f), 0, 255); g = clamp(Math.round(g * f), 0, 255); b = clamp(Math.round(b * f), 0, 255);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function cellFromMapChar(ch) {
  switch (ch) {
    case "#": return { type: BRICK, hp: 2 };
    case "@": return { type: STEEL, hp: 1 };
    case "~": return { type: WATER, hp: 1 };
    case "%": return { type: TREE, hp: 1 };
    case "B": return { type: BASE, hp: 1 };
    default:  return { type: EMPTY, hp: 0 };
  }
}

function buildLevel(n) {
  const map = LEVELS[n % LEVELS.length];
  grid = [];
  baseCells = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      const cell = cellFromMapChar(map[r][c]);
      grid[r][c] = cell;
      if (cell.type === BASE) baseCells.push({ row: r, col: c });
    }
  }
}

function cellRange(rect) {
  const c0 = clamp(Math.floor(rect.x / TILE), 0, COLS - 1);
  const c1 = clamp(Math.floor((rect.x + rect.w - 0.001) / TILE), 0, COLS - 1);
  const r0 = clamp(Math.floor(rect.y / TILE), 0, ROWS - 1);
  const r1 = clamp(Math.floor((rect.y + rect.h - 0.001) / TILE), 0, ROWS - 1);
  return { c0, c1, r0, r1 };
}

function tankRect(t) { return { x: t.x, y: t.y, w: TANK_SIZE, h: TANK_SIZE }; }

// 坦克 / 子弹是否能进入某个格子
function isSolidForTank(type) { return type === BRICK || type === STEEL || type === WATER || type === BASE; }
function isSolidForBullet(type) { return type === BRICK || type === STEEL || type === BASE; }

// 坦克移动碰撞检测
function tankBlocked(rect, self) {
  if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > FIELD_W || rect.y + rect.h > FIELD_H) return true;
  const r = cellRange(rect);
  for (let row = r.r0; row <= r.r1; row++)
    for (let col = r.c0; col <= r.c1; col++)
      if (isSolidForTank(grid[row][col].type)) return true;
  if (self) {
    const others = [player, ...enemies];
    for (const t of others) {
      if (!t || t === self || t.spawning || t.dead) continue;
      if (rectsOverlap(rect, tankRect(t))) return true;
    }
  }
  return false;
}

// 子弹命中：返回击中的首个实体格子
function bulletHitCell(rect) {
  const r = cellRange(rect);
  for (let row = r.r0; row <= r.r1; row++)
    for (let col = r.c0; col <= r.c1; col++) {
      if (isSolidForBullet(grid[row][col].type)) return { row, col, cell: grid[row][col] };
    }
  return null;
}

/* ============================== 实体 ============================== */
function makeTank(x, y, dir, opts) {
  return Object.assign({
    x, y, dir,
    speed: TANK_SPEED,
    color: "#f4c542",
    hp: 1,
    isPlayer: false,
    dead: false,
    spawning: false,
    spawnTimer: 0,
    aiTimer: 0,
    shootTimer: 0,
    shootCooldown: 0,
    type: 0,
    flash: 0,
  }, opts);
}

function makeBullet(x, y, dir, owner, canSteel, speed) {
  return { x, y, dir, owner, canSteel, speed, dead: false, size: BULLET_SIZE };
}

function makePowerup(x, y, type) {
  return { x, y, type, timer: 0, dead: false };
}

function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(20, speed || 140);
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.25, 0.6), maxLife: 0.6,
      color: color, size: rand(2, 5),
    });
  }
}

/* ============================== 初始化 ============================== */
function resetGame() {
  score = 0; lives = 3; level = 0; firepower = 0;
  shieldTimer = 0; freezeTimer = 0;
  startLevel(0);
}

function startLevel(n) {
  level = n;
  buildLevel(n);
  bullets = []; powerups = []; particles = []; enemies = [];
  remainingSpawns = ENEMIES_PER_LEVEL;
  totalSpawned = 0;
  spawnTimer = 1.2;
  baseAlive = true;
  freezeTimer = 0;
  spawnPlayer();
  state = "intro";
  stateTimer = 2.2;
  AudioFX.start();
}

function spawnPlayer() {
  player = makeTank(playerSpawn.col * TILE + TANK_MARGIN, playerSpawn.row * TILE + TANK_MARGIN, UP, {
    isPlayer: true,
    color: "#f4c542",
    spawning: true,
    spawnTimer: 2.0,
  });
}

function spawnEnemy() {
  if (remainingSpawns <= 0 || enemies.length >= MAX_ENEMIES_ON_SCREEN) return false;
  const spawnCols = [0, 7, 15];
  // 优先选没有坦克的出生点
  let col = spawnCols[randInt(0, spawnCols.length - 1)];
  for (let i = 0; i < spawnCols.length; i++) {
    const c = spawnCols[i];
    const x = c * TILE + TANK_MARGIN, y = 0 * TILE + TANK_MARGIN;
    const r = { x, y, w: TANK_SIZE, h: TANK_SIZE };
    if (!enemies.some(e => !e.dead && rectsOverlap(r, tankRect(e)))) { col = c; break; }
  }
  const idx = totalSpawned;
  const type = (Math.floor(idx / 4) + level) % ENEMY_TYPES.length;  // 随着数量提升强度
  const info = ENEMY_TYPES[type];
  const enemy = makeTank(col * TILE + TANK_MARGIN, TANK_MARGIN, DOWN, {
    isPlayer: false,
    color: info.color,
    hp: info.hp,
    speed: info.speed,
    type: type,
    spawning: true,
    spawnTimer: 1.6,
    hasBonus: (idx + 1) % 4 === 0,
    aiTimer: rand(0.8, 1.6),
    shootTimer: rand(1.0, 2.5),
  });
  enemies.push(enemy);
  remainingSpawns--;
  totalSpawned++;
  return true;
}

/* ============================== 输入 ============================== */
const KEYMAP = {
  ArrowUp: UP, KeyW: UP, ArrowRight: RIGHT, KeyD: RIGHT,
  ArrowDown: DOWN, KeyS: DOWN, ArrowLeft: LEFT, KeyA: LEFT,
};
function dirPressed() {
  for (const k in KEYMAP) if (keys[k]) return KEYMAP[k];
  return -1;
}
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyP" && (state === "playing" || state === "paused")) togglePause();
  if (e.code === "KeyM") AudioFX.toggle();
  if (e.code === "Enter") {
    if (state === "start") { resetGame(); }
    else if (state === "gameover" || state === "victory") { state = "start"; }
  }
  if (e.code === "KeyR") { resetGame(); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function togglePause() {
  state = state === "paused" ? "playing" : "paused";
}

/* ============================== 射击 ============================== */
function tankBulletCount(owner) {
  return bullets.filter(b => !b.dead && b.owner === owner).length;
}

function fireFrom(tank, canSteel, speed, double) {
  const cx = tank.x + TANK_SIZE / 2, cy = tank.y + TANK_SIZE / 2;
  const v = DIR_VEC[tank.dir];
  const m = TANK_SIZE / 2 + 2;
  const bx = cx - BULLET_SIZE / 2 + v[0] * m;
  const by = cy - BULLET_SIZE / 2 + v[1] * m;
  bullets.push(makeBullet(bx, by, tank.dir, tank, canSteel, speed));
  if (double) {
    // 第二发：垂直于移动方向偏移
    const p = tank.dir === UP || tank.dir === DOWN ? [1, 0] : [0, 1];
    const off = 7;
    bullets.push(makeBullet(bx + p[0] * off, by + p[1] * off, tank.dir, tank, canSteel, speed));
    bullets.push(makeBullet(bx - p[0] * off, by - p[1] * off, tank.dir, tank, canSteel, speed));
  }
  AudioFX.shoot();
}

function playerShoot() {
  const maxBullets = firepower >= 2 ? 4 : 1;
  const count = tankBulletCount(player);
  const double = firepower >= 2;
  const speed = BULLET_SPEEDS[firepower];
  const canSteel = firepower >= 3;
  if (double) {
    if (count <= maxBullets - 3) fireFrom(player, canSteel, speed, true);
    else if (count < maxBullets) fireFrom(player, canSteel, speed, false);
  } else {
    if (count < maxBullets) fireFrom(player, canSteel, speed, false);
  }
}

/* ============================== 更新 ============================== */
function update(dt) {
  if (state === "intro" || state === "gameover" || state === "victory") {
    stateTimer -= dt;
    if (state === "intro" && stateTimer <= 0) state = "playing";
    return;
  }
  if (state !== "playing") return;

  // 护盾 / 冰冻计时
  if (shieldTimer > 0) shieldTimer -= dt;
  if (freezeTimer > 0) freezeTimer -= dt;

  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updatePowerups(dt);
  updateParticles(dt);

  // 生成敌人
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    if (spawnEnemy()) spawnTimer = 1.4;
    else spawnTimer = 0.3;
  }

  // 关卡通关判定
  if (remainingSpawns <= 0 && enemies.length === 0 && state === "playing") {
    level++;
    if (level >= LEVELS.length) {
      state = "victory";
      stateTimer = 9999;
      if (score > hiScore) { hiScore = score; try { localStorage.setItem("tankbattle_hiscore", String(hiScore)); } catch (e) {} }
    } else {
      startLevel(level);
    }
  }
}

function updatePlayer(dt) {
  if (!player || player.dead) return;
  if (player.spawning) {
    player.spawnTimer -= dt;
    if (player.spawnTimer <= 0) player.spawning = false;
  }
  const d = dirPressed();
  if (d >= 0) {
    if (d === player.dir || d === (player.dir + 2) % 4) {
      player.dir = d;   // 同向或反向：直接转向
    } else {
      // 垂直转向 → 对齐 x；水平转向 → 对齐 y
      if (d === UP || d === DOWN) player.x = snap(player.x);
      else player.y = snap(player.y);
      player.dir = d;
    }
  }
  // 移动
  if (d >= 0) {
    const v = DIR_VEC[player.dir];
    const nx = player.x + v[0] * player.speed * dt;
    const ny = player.y + v[1] * player.speed * dt;
    const r = { x: nx, y: ny, w: TANK_SIZE, h: TANK_SIZE };
    if (!tankBlocked(r, player)) { player.x = nx; player.y = ny; }
    else if (v[0] !== 0) player.y = snap(player.y);
    else if (v[1] !== 0) player.x = snap(player.x);
  }
  // 射击
  if (keys.Space) {
    player.shootCooldown -= dt;
    if (player.shootCooldown <= 0) {
      playerShoot();
      player.shootCooldown = 0.25;
    }
  } else {
    player.shootCooldown = 0;
  }
}

function snap(v) {
  return Math.round((v - TANK_MARGIN) / TILE) * TILE + TANK_MARGIN;
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.spawning) {
      e.spawnTimer -= dt;
      if (e.spawnTimer <= 0) e.spawning = false;
      continue;
    }
    const frozen = freezeTimer > 0;

    // 移动 AI
    e.aiTimer -= dt;
    if (e.aiTimer <= 0) {
      e.aiTimer = rand(0.6, 2.0);
      // 尝试换方向：若当前方向被挡，随机换
      const v = DIR_VEC[e.dir];
      const r = { x: e.x + v[0] * 4, y: e.y + v[1] * 4, w: TANK_SIZE, h: TANK_SIZE };
      const blocked = tankBlocked(r, e);
      const turn = blocked || Math.random() < 0.35;
      if (turn) {
        const choices = [UP, RIGHT, DOWN, LEFT].filter(d => {
          const vv = DIR_VEC[d];
          return !tankBlocked({ x: e.x + vv[0] * 4, y: e.y + vv[1] * 4, w: TANK_SIZE, h: TANK_SIZE }, e);
        });
        if (choices.length) {
          // 偏向继续向下的方向
          const downish = choices.filter(d => d === DOWN || d === LEFT || d === RIGHT);
          const pool = choices.filter(d => d !== (e.dir + 2) % 4); // 尽量不原路返回
          const use = (pool.length ? pool : choices);
          e.dir = use[randInt(0, use.length - 1)];
        } else {
          e.dir = (e.dir + randInt(1, 3)) % 4;
        }
      }
    }

    if (!frozen) {
      const v = DIR_VEC[e.dir];
      const nx = e.x + v[0] * e.speed * dt;
      const ny = e.y + v[1] * e.speed * dt;
      const r = { x: nx, y: ny, w: TANK_SIZE, h: TANK_SIZE };
      if (!tankBlocked(r, e)) { e.x = nx; e.y = ny; }
      else { e.aiTimer = 0; }
    }

    // 射击
    e.shootTimer -= dt;
    if (!frozen && e.shootTimer <= 0) {
      e.shootTimer = rand(1.2, 3.0);
      if (tankBulletCount(e) < 1 && Math.random() < 0.7) {
        fireFrom(e, false, 280, false);
      }
    }

    // 敌人触碰到基地 → 游戏结束
    if (baseAlive) {
      for (const b of baseCells) {
        const br = { x: b.col * TILE, y: b.row * TILE, w: TILE, h: TILE };
        if (rectsOverlap(tankRect(e), br)) { destroyBase(); return; }
      }
    }
  }
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (b.dead) continue;
    const v = DIR_VEC[b.dir];
    b.x += v[0] * b.speed * dt;
    b.y += v[1] * b.speed * dt;
    const r = { x: b.x, y: b.y, w: b.size, h: b.size };

    // 出界
    if (b.x < 0 || b.y < 0 || b.x > FIELD_W || b.y > FIELD_H) { b.dead = true; continue; }

    // 撞墙
    const hit = bulletHitCell(r);
    if (hit) {
      const c = hit.cell;
      if (c.type === BRICK) {
        c.hp--;
        if (c.hp <= 0) c.type = EMPTY;
        spawnParticles(hit.col * TILE + TILE / 2, hit.row * TILE + TILE / 2, "#c07a3a", 6, 90);
        AudioFX.hitWall();
      } else if (c.type === STEEL) {
        if (b.canSteel) { c.type = EMPTY; spawnParticles(hit.col * TILE + TILE / 2, hit.row * TILE + TILE / 2, "#9aa4b2", 6, 90); }
        AudioFX.hitSteel();
      } else if (c.type === BASE) {
        destroyBase();
      }
      b.dead = true;
      continue;
    }

    // 撞坦克
    if (b.owner === player) {
      for (const e of enemies) {
        if (e.dead || e.spawning) continue;
        const er = { x: e.x - 2, y: e.y - 2, w: TANK_SIZE + 4, h: TANK_SIZE + 4 };
        if (rectsOverlap(r, er)) { hitEnemy(e, b); b.dead = true; break; }
      }
    } else {
      if (player && !player.dead && !player.spawning && shieldTimer <= 0) {
        const pr = { x: player.x - 2, y: player.y - 2, w: TANK_SIZE + 4, h: TANK_SIZE + 4 };
        if (rectsOverlap(r, pr)) { hitPlayer(); b.dead = true; }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

function hitEnemy(e, b) {
  e.hp--;
  e.flash = 0.12;
  if (e.hp <= 0) {
    e.dead = true;
    const info = ENEMY_TYPES[e.type];
    score += info.score;
    spawnParticles(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2, "#ff9b3d", 16, 160);
    AudioFX.explode();
    if (e.hasBonus) dropPowerup(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2);
  } else {
    AudioFX.hitSteel();
  }
  enemies = enemies.filter(en => !en.dead);
}

function hitPlayer() {
  if (!player || player.dead || shieldTimer > 0) return;
  player.dead = true;
  spawnParticles(player.x + TANK_SIZE / 2, player.y + TANK_SIZE / 2, "#f4c542", 18, 170);
  AudioFX.explode();
  lives--;
  if (lives <= 0) {
    state = "gameover";
    stateTimer = 9999;
    if (score > hiScore) { hiScore = score; try { localStorage.setItem("tankbattle_hiscore", String(hiScore)); } catch (e) {} }
    AudioFX.gameover();
  } else {
    // 立即重生（带短暂无敌）
    spawnPlayer();
  }
}

function destroyBase() {
  if (!baseAlive) return;
  baseAlive = false;
  for (const b of baseCells) {
    grid[b.row][b.col].type = EMPTY;
    spawnParticles(b.col * TILE + TILE / 2, b.row * TILE + TILE / 2, "#ff6b6b", 20, 180);
  }
  AudioFX.explode();
  state = "gameover";
  stateTimer = 9999;
  if (score > hiScore) { hiScore = score; try { localStorage.setItem("tankbattle_hiscore", String(hiScore)); } catch (e) {} }
  AudioFX.gameover();
}

function updatePowerups(dt) {
  for (const p of powerups) {
    p.timer += dt;
    if (p.timer > 10) p.dead = true;
    if (player && !player.dead) {
      const pr = tankRect(player);
      const prr = { x: p.x, y: p.y, w: 32, h: 32 };
      if (rectsOverlap(pr, prr)) { collectPowerup(p); p.dead = true; }
    }
  }
  powerups = powerups.filter(p => !p.dead);
}

function dropPowerup(x, y) {
  const types = ["star", "star", "bomb", "shield", "life", "freeze"];
  const t = types[randInt(0, types.length - 1)];
  powerups.push(makePowerup(x - 16, y - 16, t));
}

function collectPowerup(p) {
  switch (p.type) {
    case "star":  firepower = Math.min(3, firepower + 1); AudioFX.powerup(); break;
    case "bomb":  bombEnemies(); AudioFX.explode(); break;
    case "shield": shieldTimer = 10; AudioFX.powerup(); break;
    case "life":  lives = Math.min(MAX_LIVES, lives + 1); AudioFX.life(); break;
    case "freeze": freezeTimer = 8; AudioFX.powerup(); break;
  }
  spawnParticles(p.x + 16, p.y + 16, "#7cf7ff", 10, 110);
}

function bombEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    e.dead = true;
    const info = ENEMY_TYPES[e.type];
    score += info.score;
    spawnParticles(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2, "#ff9b3d", 14, 150);
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

/* ============================== 渲染 ============================== */
function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  drawField();
  drawHUD();
  drawParticles();
  drawBullets();
  drawPowerups();
  if (player && !player.dead) drawTank(player);
  for (const e of enemies) if (!e.dead) drawTank(e);
  drawOverlay();
}

function drawField() {
  // 背景
  ctx.fillStyle = "#0d1117";
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c];
      const x = c * TILE, y = r * TILE;
      switch (cell.type) {
        case BRICK: drawBrick(x, y, cell.hp); break;
        case STEEL: drawSteel(x, y); break;
        case WATER: drawWater(x, y); break;
        case TREE:  break; // 树在最后统一画（覆盖坦克）
        case BASE:  drawBase(x, y); break;
      }
    }
  }
  // 树覆盖在坦克之上
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c].type === TREE) drawTree(c * TILE, r * TILE);
}

function drawBrick(x, y, hp) {
  ctx.fillStyle = "#8a4b2f";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#a85e37";
  const rows = 4, cols = 2;
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      ctx.fillRect(x + j * 20, y + i * 10 + (j % 2 ? 0 : 0), 20, 5);
    }
  }
  // 砖缝
  ctx.strokeStyle = "#5c2f1a"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
  if (hp <= 1) {
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "#2a2a2a";
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + TILE, y + TILE);
    ctx.moveTo(x + TILE, y); ctx.lineTo(x, y + TILE);
    ctx.stroke();
  }
}

function drawSteel(x, y) {
  ctx.fillStyle = "#9aa4b2";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#d6dde6";
  ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
  ctx.fillStyle = "#6d7684";
  ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
  ctx.strokeStyle = "#4a505a"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
}

function drawWater(x, y) {
  const t = performance.now() / 600;
  ctx.fillStyle = "#1c4d7a";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#2f6ea8";
  for (let i = 0; i < 3; i++) {
    const oy = (i * 13 + t * 20) % TILE;
    ctx.fillRect(x + 2, y + oy, TILE - 4, 4);
  }
  ctx.strokeStyle = "#123a5c"; ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
}

function drawTree(x, y) {
  ctx.fillStyle = "#1f5a2f";
  ctx.beginPath();
  ctx.arc(x + TILE / 2, y + TILE / 2, TILE / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#2c7a41";
  ctx.beginPath();
  ctx.arc(x + TILE / 2 - 4, y + TILE / 2 - 4, TILE / 2 - 8, 0, Math.PI * 2);
  ctx.arc(x + TILE / 2 + 5, y + TILE / 2 + 3, TILE / 2 - 9, 0, Math.PI * 2);
  ctx.fill();
}

function drawBase(x, y) {
  // 基地（鹰旗）
  ctx.fillStyle = "#111827";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#374151"; ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
  const cx = x + TILE / 2, cy = y + TILE / 2;
  // 旗帜
  ctx.fillStyle = "#e5e7eb";
  ctx.fillRect(cx - 1, y + 6, 2, TILE - 12);
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.moveTo(cx + 1, y + 8);
  ctx.lineTo(cx + 12, y + 13);
  ctx.lineTo(cx + 1, y + 18);
  ctx.closePath();
  ctx.fill();
  // 鹰
  ctx.fillStyle = "#f4c542";
  ctx.beginPath();
  ctx.arc(cx - 3, y + 28, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawTank(t) {
  const blink = (t.spawning || t.flash > 0) && Math.floor(performance.now() / 90) % 2 === 0;
  const cx = t.x + TANK_SIZE / 2, cy = t.y + TANK_SIZE / 2;
  ctx.save();
  ctx.globalAlpha = blink ? 0.35 : 1;
  ctx.translate(cx, cy);
  ctx.rotate(DIR_ANGLE[t.dir]);
  // 履带
  ctx.fillStyle = shade(t.color, 0.55);
  ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, 6, TANK_SIZE);
  ctx.fillRect(TANK_SIZE / 2 - 6, -TANK_SIZE / 2, 6, TANK_SIZE);
  // 履带纹理
  ctx.fillStyle = shade(t.color, 0.35);
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2 + i * 9, 6, 3);
    ctx.fillRect(TANK_SIZE / 2 - 6, -TANK_SIZE / 2 + i * 9 + 4, 6, 3);
  }
  // 车身
  ctx.fillStyle = t.color;
  ctx.fillRect(-TANK_SIZE / 2 + 5, -TANK_SIZE / 2 + 2, TANK_SIZE - 10, TANK_SIZE - 4);
  ctx.fillStyle = shade(t.color, 0.8);
  ctx.fillRect(-TANK_SIZE / 2 + 5, -TANK_SIZE / 2 + 2, TANK_SIZE - 10, 4);
  // 炮塔
  ctx.fillStyle = shade(t.color, 1.15);
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(t.color, 0.9);
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  // 炮管
  ctx.fillStyle = t.color;
  ctx.fillRect(-2, -TANK_SIZE / 2 - 7, 4, 10);
  // 玩家标识
  if (t.isPlayer) {
    ctx.fillStyle = "#1f1f1f";
    ctx.font = "bold 7px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("★", 0, 1);
  }
  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    ctx.fillStyle = b.owner === player ? "#ffe08a" : "#ff8a8a";
    ctx.fillRect(b.x, b.y, b.size, b.size);
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.fillRect(b.x + 1, b.y + 1, b.size - 2, 1);
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const blink = Math.floor(performance.now() / 200) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 1 : 0.6;
    ctx.fillStyle = "#111";
    ctx.fillRect(p.x, p.y, 32, 32);
    ctx.strokeStyle = powerupColor(p.type);
    ctx.lineWidth = 3;
    ctx.strokeRect(p.x + 2, p.y + 2, 28, 28);
    ctx.fillStyle = powerupColor(p.type);
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(powerupSymbol(p.type), p.x + 16, p.y + 17);
    ctx.restore();
  }
}

function powerupColor(t) {
  return { star: "#ffd23f", bomb: "#ff6b6b", shield: "#7cf7ff", life: "#6bff9b", freeze: "#7cb8ff" }[t] || "#fff";
}
function powerupSymbol(t) {
  return { star: "★", bomb: "💥", shield: "◆", life: "+", freeze: "❄" }[t] || "?";
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const x = FIELD_W;
  ctx.fillStyle = "#161b26";
  ctx.fillRect(x, 0, HUD_W, CANVAS_H);
  ctx.strokeStyle = "#2a3142";
  ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, CANVAS_H); ctx.stroke();

  let y = 28;
  ctx.textBaseline = "top";
  ctx.textAlign = "left";

  ctx.fillStyle = "#8b93a7"; ctx.font = "13px sans-serif";
  ctx.fillText("得分 SCORE", x + 20, y);
  ctx.fillStyle = "#fff"; ctx.font = "bold 26px monospace";
  ctx.fillText(String(score).padStart(6, "0"), x + 20, y + 20);

  y += 78;
  ctx.fillStyle = "#8b93a7"; ctx.font = "13px sans-serif";
  ctx.fillText("生命 LIVES", x + 20, y);
  for (let i = 0; i < Math.max(lives, 0); i++) drawMiniTank(x + 20 + i * 26, y + 24);
  if (lives <= 0) { ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 15px sans-serif"; ctx.fillText("已耗尽", x + 20, y + 24); }

  y += 64;
  ctx.fillStyle = "#8b93a7"; ctx.font = "13px sans-serif";
  ctx.fillText("关卡 LEVEL", x + 20, y);
  ctx.fillStyle = "#fff"; ctx.font = "bold 22px monospace";
  ctx.fillText(String(level + 1), x + 20, y + 20);

  y += 62;
  ctx.fillStyle = "#8b93a7"; ctx.font = "13px sans-serif";
  ctx.fillText("敌人 ENEMIES", x + 20, y);
  ctx.fillStyle = "#ff8a8a"; ctx.font = "bold 22px monospace";
  ctx.fillText(String(remainingSpawns + enemies.length), x + 20, y + 20);

  y += 62;
  ctx.fillStyle = "#8b93a7"; ctx.font = "13px sans-serif";
  ctx.fillText("火力 POWER", x + 20, y);
  ctx.fillStyle = "#ffd23f";
  ctx.font = "22px sans-serif";
  ctx.fillText("★".repeat(firepower + 1), x + 20, y + 22);

  // 状态条
  y += 70;
  if (shieldTimer > 0) {
    ctx.fillStyle = "#7cf7ff"; ctx.font = "12px sans-serif";
    ctx.fillText("护盾 " + shieldTimer.toFixed(1) + "s", x + 20, y);
    y += 20;
  }
  if (freezeTimer > 0) {
    ctx.fillStyle = "#7cb8ff"; ctx.font = "12px sans-serif";
    ctx.fillText("冰冻 " + freezeTimer.toFixed(1) + "s", x + 20, y);
    y += 20;
  }

  // 操作说明
  ctx.fillStyle = "#5b6375"; ctx.font = "12px sans-serif";
  const hint = [
    "移动  WASD / 方向键",
    "射击  空格",
    "暂停  P",
    "静音  M",
    "重开  R",
    "",
    "保护你的基地！",
    "击毁所有敌人过关",
  ];
  let hy = CANVAS_H - hint.length * 18 - 16;
  for (const h of hint) { ctx.fillText(h, x + 20, hy); hy += 18; }

  // 最高分
  ctx.fillStyle = "#8b93a7"; ctx.font = "12px sans-serif";
  ctx.fillText("最高分 " + hiScore, x + 20, CANVAS_H - 16);
}

function drawMiniTank(x, y) {
  ctx.fillStyle = "#f4c542";
  ctx.fillRect(x, y + 3, 18, 8);
  ctx.fillRect(x + 7, y, 4, 14);
  ctx.fillStyle = "#8a6a1e";
  ctx.fillRect(x, y + 3, 3, 8);
  ctx.fillRect(x + 15, y + 3, 3, 8);
}

function drawOverlay() {
  if (state === "start") {
    dim();
    centerText("坦 克 大 战", 54, "#f4c542", -60, "bold");
    centerText("TANK BATTLE", 18, "#8b93a7", -24);
    centerText("方向键 / WASD 移动 · 空格射击 · 保护基地", 15, "#c9d1e0", 24);
    centerText("按 Enter 开始", 22, "#fff", 80, "bold");
  } else if (state === "intro") {
    dim(0.4);
    centerText("第 " + (level + 1) + " 关", 46, "#fff", 0, "bold");
  } else if (state === "paused") {
    dim();
    centerText("已暂停", 44, "#fff", -10, "bold");
    centerText("按 P 继续", 16, "#8b93a7", 30);
  } else if (state === "gameover") {
    dim();
    centerText("游 戏 结 束", 50, "#ff6b6b", -70, "bold");
    centerText("最终得分 " + score, 22, "#fff", -10);
    centerText("最高分 " + hiScore, 15, "#8b93a7", 24);
    centerText("按 Enter 返回 · 按 R 重新开始", 15, "#c9d1e0", 70);
  } else if (state === "victory") {
    dim();
    centerText("胜 利 ！", 54, "#6bff9b", -60, "bold");
    centerText("你守住了基地，全部敌人被消灭", 18, "#fff", -10);
    centerText("最终得分 " + score + " · 最高分 " + hiScore, 16, "#8b93a7", 24);
    centerText("按 Enter 返回 · 按 R 再来一局", 15, "#c9d1e0", 70);
  }
}

function dim(a) {
  ctx.fillStyle = "rgba(5,8,14," + (a || 0.72) + ")";
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
}

function centerText(text, size, color, dy, weight) {
  ctx.fillStyle = color;
  ctx.font = (weight ? weight + " " : "") + size + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, FIELD_W / 2, FIELD_H / 2 + (dy || 0));
}

/* ============================== 主循环 ============================== */
let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05) || 0;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ============================== 自适应缩放 ============================== */
function resize() {
  const scale = Math.min(window.innerWidth / CANVAS_W, window.innerHeight / CANVAS_H);
  const s = Math.min(scale, 1.4);
  canvas.style.width = (CANVAS_W * s) + "px";
  canvas.style.height = (CANVAS_H * s) + "px";
}
window.addEventListener("resize", resize);

// 启动
buildLevel(0);
resize();
requestAnimationFrame(loop);
</script>
